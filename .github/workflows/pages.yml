name: Publish to GitHub Pages

# Builds the pages from data/content.json and publishes the website only.
# The working files (brief, voice guide, log, content calendar, photo
# inbox, data and tools) stay in the repository and off the public site.

on:
  push:
    branches: [main]
    paths-ignore: ['inbox/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the pages
        run: python3 tools/build.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
