name: Update previews

# When Artiscope Digital Home makes or changes one of its copies of the site (a branch
# named adh/<name>), or a copy is removed, publish the site again so its
# preview at preview/<name>/ is up to date. The live pages are rebuilt from
# main, so they do not change.

on:
  create:
  push:
    branches: ['adh/**']
    paths-ignore: ['inbox/**']
  delete:

permissions:
  actions: write

jobs:
  start:
    if: github.event_name == 'push' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'adh/'))
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
